
name: Build Geundadeo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP file not found."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found in ZIP."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          cp -R "$ROOT"/. .

          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "APK file was not created."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geundadeo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
